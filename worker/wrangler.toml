name = "phill-quiz-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

# The site is served by this Worker too, at https://phill.rootb1t.com (custom domain, set in the dashboard):
# the repo root holds the front end; .assetsignore keeps the Worker code and repo files out. Requests that match a
# file get the file; everything else reaches src/index.js. The API has no path prefix, so its routes are listed in
# run_worker_first: they always go to the code, even if a file with the same name ever appears.
[assets]
directory = "../"
run_worker_first = [
  "/questions", "/scores", "/player", "/prices", "/baskets", "/achievements", "/events", "/events/*", "/facts", "/phil",
  "/admin/*", "/auth/*", "/me", "/invites", "/invites/*", "/portals", "/portals/*", "/portal", "/builder/*"
]

# Single store for facts, questions and scores (SQLite-backed Durable Object, available on the free plan)
[[durable_objects.bindings]]
name = "STORE"
class_name = "QuizStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuizStore"]

[vars]
MODEL = "claude-sonnet-5-5"
FACTS_PER_HOUR_PER_IP = "20"
FACTS_PER_DAY_TOTAL = "100"

# Secrets are set in the Cloudflare dashboard (Settings -> Variables and secrets), not here:
#   AI_API_KEY        - API key for Root AI - model b1t quiz v1.1
#   ADMIN_TOKEN       - any long password for the admin.html page

# Hourly refresh of the Divine Orb prices (also builds the daily price history)
[triggers]
crons = ["17 * * * *"]

[observability]
enabled = true
